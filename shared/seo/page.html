<!--
  ============================================================================
  GDS SEO 페이지별 (여기만 수정)
  파일: shared/seo/page.html

  수정 항목 (최대 6개 + 선택 2개)
  1. title
  2. meta description
  3. canonical URL  (= og:url 과 동일)
  4. og:title       (= twitter:title 과 동일)
  5. og:description (= twitter:description 과 동일)
  6. og:image       (= twitter:image 과 동일)
  + FAQ / Breadcrumb 는 해당 파일이 있을 때만 추가

  자세한 순서: shared/seo/README.md
  ============================================================================
-->

<!-- 1) title -->
<title>__PAGE_TITLE__</title>

<!-- 2) description -->
<meta name="description" content="__PAGE_DESCRIPTION__">

<!-- 3) canonical (+ og:url) -->
<link rel="canonical" href="__CANONICAL_URL__">
<meta property="og:url" content="__CANONICAL_URL__">

<!-- 4 · 5) og:title / og:description -->
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="__OG_DESCRIPTION__">

<!-- 6) og:image (1200×630 권장) -->
<meta property="og:image" content="__OG_IMAGE_URL__">

<!-- Twitter — OG와 동일 값 (추가 수정 불필요) -->
<meta name="twitter:title" content="__OG_TITLE__">
<meta name="twitter:description" content="__OG_DESCRIPTION__">
<meta name="twitter:image" content="__OG_IMAGE_URL__">

<!-- WebPage Schema — 위 1~3 값만 사용 (추가 수정 불필요) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "@id": "__CANONICAL_URL__#webpage",
  "name": "__PAGE_TITLE__",
  "description": "__PAGE_DESCRIPTION__",
  "url": "__CANONICAL_URL__",
  "inLanguage": "ko-KR",
  "isPartOf": { "@id": "https://gdsprs.com/#website" },
  "about": { "@id": "https://gdsprs.com/#clinic" },
  "publisher": { "@id": "https://gdsprs.com/#organization" }
}
</script>
